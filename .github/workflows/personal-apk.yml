name: Personal ARM64 APK

on:
  push:
    branches: [codex/personal-apk]
  workflow_dispatch:
    inputs:
      reuse_runtime_run:
        description: Successful checks/runtime run with identical runtime sources
        type: string
        required: false
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  checks:
    if: github.repository == 'yusheng266186-beep/dsh-Go' && inputs.reuse_runtime_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Seed the verified Purge archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/dsh-purge-community-1.7.20.tgz"
          if timeout 45s gh api --header 'Accept: application/octet-stream' \
            repos/kingcharleslzy-ai/dsh-purge/releases/assets/759613338 > "$archive" 2>/dev/null &&
            printf '%s  %s\n' 5b3d66e804ea0b1cf6ef01035a292755ab9fea771b8f5338000954075dd6b45a "$archive" | sha256sum --check --status; then
            npm cache add "$archive" --ignore-scripts
          fi
      - name: Prepare the isolated test runtime
        run: |
          prefix="$RUNNER_TEMP/dsh"
          mkdir "$prefix"
          cp runtime/locks/dsh-0.2.2-rc.5/package*.json "$prefix/"
          npm ci --prefix "$prefix" --ignore-scripts --no-audit --no-fund
          cp "$prefix/node_modules/@deepseek-ai/dsh-fs-local/lib/index.js" "$prefix/fs-local-original.js"
          python3 -I runtime/lib/rtbuild.py patch-dsh --prefix "$prefix" --dsh-version 0.2.2-rc.5 --target android
          python3 -I runtime/integrations/install.py "$prefix"
          pnpm="$RUNNER_TEMP/pnpm"
          mkdir "$pnpm"
          cp runtime/locks/pnpm-11.28.5/package*.json "$pnpm/"
          npm ci --prefix "$pnpm" --ignore-scripts --no-audit --no-fund
          {
            echo "DSH_PREFIX=$prefix"
            echo "DSH_TEST_PREFIX=$prefix"
            echo "DSH_INSTALL=$prefix/node_modules/@deepseek-ai/dsh"
            echo "DSH_TOOLS_DIR=$prefix/node_modules/@deepseek-ai/dsh-tools"
            echo "DSH_FS_LOCAL_ORIGINAL_JS=$prefix/fs-local-original.js"
            echo "PNPM_BIN=$pnpm/node_modules/pnpm/bin/pnpm.mjs"
          } >> "$GITHUB_ENV"
      - name: Runtime regressions and actual SDK transport
        run: |
          node --test --test-concurrency=4 runtime/tests/*.test.mjs app/tool/engine_auth/*.test.mjs
          python3 -I runtime/tests/test_patch_dsh.py
          node runtime/tests/codebuddy-roundtrip.mjs "$DSH_PREFIX"

  reuse:
    if: github.repository == 'yusheng266186-beep/dsh-Go' && inputs.reuse_runtime_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require passing jobs and identical runtime sources
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ inputs.reuse_runtime_run }}
        run: |
          python3 - <<'PYVERIFY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          run = os.environ['VERIFIED_RUN']
          assert run.isdigit(), 'A numeric workflow run ID is required'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          old = api('actions/runs/' + run)
          assert old['name'] == 'Personal ARM64 APK'
          jobs = api('actions/runs/' + run + '/jobs')['jobs']
          for name in ('checks', 'runtime'):
              assert any(job['name'] == name and job['conclusion'] == 'success' for job in jobs), name
          tree = api('git/commits/' + old['head_sha'])['tree']['sha']
          def directory(path):
              sha = tree
              for part in path.split('/'):
                  sha = next(item['sha'] for item in api('git/trees/' + sha)['tree'] if item['path'] == part)
              return sha
          for path in ('runtime', 'app/tool/engine_auth'):
              current = subprocess.check_output(['git', 'rev-parse', 'HEAD:' + path], text=True).strip()
              assert directory(path) == current, 'Runtime inputs changed: ' + path
          print('Reusing the passed checks and immutable runtime artifact from', old['head_sha'])
          PYVERIFY

  runtime:
    needs: checks
    if: github.repository == 'yusheng266186-beep/dsh-Go'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/out
          key: personal-arm64-runtime-${{ hashFiles('runtime/build-runtime.sh', 'runtime/lib/**', 'runtime/locks/**', 'runtime/patches/**', 'runtime/bridge/**', 'runtime/boot/**', 'runtime/direct/**', 'runtime/integrations/**') }}
      - name: Seed verified release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ ! -s runtime/out/arm64-v8a/assets/runtime/manifest.json ]] || exit 0
          fetch_asset() {
            local repo=$1 asset=$2 sum=$3 dest=$4
            for attempt in 1 2 3; do
              if timeout 45s gh api --header 'Accept: application/octet-stream' \
                "repos/$repo/releases/assets/$asset" > "$dest.part" &&
                printf '%s  %s\n' "$sum" "$dest.part" | sha256sum --check --status; then
                mv "$dest.part" "$dest"
                return 0
              fi
              sleep 3
            done
            return 1
          }
          purge="$RUNNER_TEMP/dsh-purge-community-1.7.20.tgz"
          if fetch_asset kingcharleslzy-ai/dsh-purge 759613338 \
            5b3d66e804ea0b1cf6ef01035a292755ab9fea771b8f5338000954075dd6b45a "$purge"; then
            npm cache add "$purge" --cache "$PWD/runtime/.cache/npm" --ignore-scripts
          else
            echo 'Purge package prefetch unavailable; npm will retry the pinned release URL.'
          fi
          mkdir -p runtime/.cache/python/20261021
          if ! fetch_asset astral-sh/python-build-standalone 663552379 \
            d91e341c028ad88a0c59fbeaa1ca866f07e8e114e96275c0b5e42728cf64a185 \
            runtime/.cache/python/20261021/SHA256SUMS; then
            echo 'Python checksum prefetch unavailable; the runtime builder will retry the release URL.'
          fi
      - name: Build pinned ARM64 runtime
        run: |
          if [[ ! -s runtime/out/arm64-v8a/assets/runtime/manifest.json ]]; then
            bash runtime/build-runtime.sh arm64-v8a
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-arm64
          path: runtime/out/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  apk:
    needs: [runtime, reuse]
    if: always() && !cancelled() && (needs.runtime.result == 'success' || needs.reuse.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_MAVEN_MIRRORS: '0'
      DSH_BETA_TOKEN_FILE: ''
      PUB_HOSTED_URL: https://pub.dev
      PERSONAL_APK_VERSION: 1.3.0-personal.1
      DSH_TEST_FONT_DIR: /tmp/dsh-personal-test-fonts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-arm64
          path: runtime/out/
          run-id: ${{ inputs.reuse_runtime_run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 12266719
          packages: platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358
          log-accepted-android-sdk-licenses: false
      - name: Select the pinned tawcroot NDK
        run: |
          version=$(python3 -c 'import json; print(json.load(open("runtime/tawcroot/source.json"))["ndkVersion"])')
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$version" >> "$GITHUB_ENV"
      - name: Provision the verified Gradle distribution
        run: |
          distribution=gradle-9.3.1-all.zip
          sha256=17f277867f6914d61b1aa02efab1ba7bb439ad652ca485cd8ca6842fccec6e43
          archive="$RUNNER_TEMP/$distribution"
          for base in https://repo.huaweicloud.com/gradle https://mirrors.cloud.tencent.com/gradle https://services.gradle.org/distributions; do
            if curl -fLSs --connect-timeout 15 --max-time 150 "$base/$distribution" -o "$archive.part" &&
              printf '%s  %s\n' "$sha256" "$archive.part" | sha256sum --check --status; then
              mv "$archive.part" "$archive"
              break
            fi
          done
          test -s "$archive"
          properties=app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s|^distributionUrl=.*|distributionUrl=file://$archive|" "$properties"
          printf '\ndistributionSha256Sum=%s\n' "$sha256" >> "$properties"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: fonts
        with:
          path: ${{ env.DSH_TEST_FONT_DIR }}
          key: personal-test-fonts-noto-cjk-20230817-repack1-3
      - name: Provision the upstream widget-test fonts
        if: steps.fonts.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update -q
          apt-get download fonts-noto-cjk='1:20230817+repack1-3' fonts-noto-cjk-extra='1:20230817+repack1-3'
          for deb in fonts-noto-cjk*.deb; do dpkg-deb -x "$deb" font-packages; done
          mkdir -p "$DSH_TEST_FONT_DIR"
          cp font-packages/usr/share/fonts/opentype/noto/NotoSansCJK-{Regular,Bold,Light}.ttc "$DSH_TEST_FONT_DIR/"
      - name: Prepare independent artwork and app identity
        run: |
          python3 -m venv "$RUNNER_TEMP/personal-art"
          "$RUNNER_TEMP/personal-art/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/personal-art/bin/python" tooling/prepare-personal-apk.py
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
      - name: Build release APK for local signing
        run: |
          (cd packages/dsh_client && dart pub get && dart analyze && dart test test/providers_api_test.dart)
          (cd app && flutter pub get --enforce-lockfile && flutter analyze --no-pub && flutter test --no-pub test/providers/provider_form_test.dart test/providers/providers_logic_test.dart)
          tooling/build-apk.sh --build-name "$PERSONAL_APK_VERSION" --no-companion -- --no-pub
      - name: Verify ABI and bundled assets
        run: |
          APK=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | sed -n '1,7p; /native-code/p'
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              files = apk.namelist()
              assert {name.split('/')[1] for name in files if name.startswith('lib/')} == {'arm64-v8a'}
              assert 'assets/runtime/manifest.json' in files
              assert 'assets/runtime/rootfs-arm64-v8a.tar.xz' in files
              assert 'assets/flutter_assets/assets/licenses/webrtc-150.7871.04.md' in files
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-to-sign
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
