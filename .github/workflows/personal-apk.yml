name: Personal ARM64 APK

on:
  push:
    branches: [codex/personal-apk]

permissions:
  contents: read

jobs:
  runtime:
    if: github.repository == 'yusheng266186-beep/dsh-Go'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/out
          key: personal-arm64-runtime-${{ hashFiles('runtime/build-runtime.sh', 'runtime/lib/**', 'runtime/locks/**', 'runtime/patches/**', 'runtime/bridge/**', 'runtime/boot/**', 'runtime/direct/**', 'runtime/integrations/**') }}
      - name: Seed verified release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ ! -s runtime/out/arm64-v8a/assets/runtime/manifest.json ]] || exit 0
          fetch_asset() {
            local repo=$1 asset=$2 sum=$3 dest=$4
            for attempt in 1 2 3; do
              if timeout 45s gh api --header 'Accept: application/octet-stream' \
                "repos/$repo/releases/assets/$asset" > "$dest.part" &&
                printf '%s  %s\n' "$sum" "$dest.part" | sha256sum --check --status; then
                mv "$dest.part" "$dest"
                return 0
              fi
              sleep 3
            done
            return 1
          }
          purge="$RUNNER_TEMP/dsh-purge-community-1.6.84.tgz"
          if fetch_asset kingcharleslzy-ai/dsh-purge 713941689 \
            1742daa8d9fbbe6f3cc4469b09a80ca0c8fc8e4b3b0e1272f4692f47f4d7aee4 "$purge"; then
            npm cache add "$purge" --cache "$PWD/runtime/.cache/npm" --ignore-scripts
          else
            echo 'Purge package prefetch unavailable; npm will retry the pinned release URL.'
          fi
          mkdir -p runtime/.cache/python/20261021
          if ! fetch_asset astral-sh/python-build-standalone 663552379 \
            d91e341c028ad88a0c59fbeaa1ca866f07e8e114e96275c0b5e42728cf64a185 \
            runtime/.cache/python/20261021/SHA256SUMS; then
            echo 'Python checksum prefetch unavailable; the runtime builder will retry the release URL.'
          fi
      - name: Build pinned ARM64 runtime
        run: |
          if [[ ! -s runtime/out/arm64-v8a/assets/runtime/manifest.json ]]; then
            bash runtime/build-runtime.sh arm64-v8a
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-arm64
          path: runtime/out/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  apk:
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DSH_MAVEN_MIRRORS: '0'
      DSH_BETA_TOKEN_FILE: ''
      PUB_HOSTED_URL: https://pub.dev
      PERSONAL_APK_VERSION: 1.0.13-personal.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: runtime-arm64
          path: runtime/out/
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: 12266719
          packages: platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358
          log-accepted-android-sdk-licenses: false
      - name: Provision the verified Gradle distribution
        run: |
          distribution=gradle-9.3.1-all.zip
          sha256=17f277867f6914d61b1aa02efab1ba7bb439ad652ca485cd8ca6842fccec6e43
          archive="$RUNNER_TEMP/$distribution"
          for base in https://repo.huaweicloud.com/gradle https://mirrors.cloud.tencent.com/gradle https://services.gradle.org/distributions; do
            if curl -fLSs --connect-timeout 15 --max-time 150 "$base/$distribution" -o "$archive.part" &&
              printf '%s  %s\n' "$sha256" "$archive.part" | sha256sum --check --status; then
              mv "$archive.part" "$archive"
              break
            fi
          done
          test -s "$archive"
          properties=app/android/gradle/wrapper/gradle-wrapper.properties
          sed -i "s|^distributionUrl=.*|distributionUrl=file://$archive|" "$properties"
          printf '\ndistributionSha256Sum=%s\n' "$sha256" >> "$properties"
      - name: Prepare independent artwork and app identity
        run: |
          python3 -m venv "$RUNNER_TEMP/personal-art"
          "$RUNNER_TEMP/personal-art/bin/pip" install Pillow==11.3.0
          "$RUNNER_TEMP/personal-art/bin/python" tooling/prepare-personal-apk.py
          python3 app/tool/l10n_merge.py --check
          python3 app/tool/guide_sync.py --check
      - name: Build release APK for local signing
        run: |
          (cd app && flutter pub get --enforce-lockfile)
          tooling/build-apk.sh --build-name "$PERSONAL_APK_VERSION" -- --no-pub
      - name: Verify ABI and bundled assets
        run: |
          APK=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" | sed -n '1,7p; /native-code/p'
          python3 - "$APK" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              files = apk.namelist()
              assert {name.split('/')[1] for name in files if name.startswith('lib/')} == {'arm64-v8a'}
              assert 'assets/runtime/manifest.json' in files
              assert 'assets/runtime/rootfs-arm64-v8a.tar.xz' in files
              assert 'assets/flutter_assets/assets/licenses/webrtc-150.7871.04.md' in files
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: apk-to-sign
          path: app/build/app/outputs/flutter-apk/app-arm64-release.apk
          compression-level: 0
          retention-days: 2
          if-no-files-found: error
